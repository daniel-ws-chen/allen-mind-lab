name: AML Full Article Footer Consistency
on:
  pull_request:
    paths:
      - 'aml-site.js'
      - 'aml-site.css'
      - 'data/articles-manifest.json'
      - 'scripts/test-unified-article-footer.cjs'
      - '.github/workflows/aml-unified-footer-qa.yml'
  push:
    branches: [main]
    paths:
      - 'aml-site.js'
      - 'aml-site.css'
      - 'data/articles-manifest.json'
      - 'scripts/test-unified-article-footer.cjs'
      - '.github/workflows/aml-unified-footer-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  footer-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/aml-footer-http.log 2>&1 &
          for i in {1..10}; do
            curl -fsS http://127.0.0.1:8765/data/articles-manifest.json >/dev/null && break
            sleep 1
          done
      - name: Validate every published article footer
        run: node scripts/test-unified-article-footer.cjs
