name: PBS Living Support preview QA
on:
  push:
    branches: [feature/pbs-living-support]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-pbs-living-support.mjs
