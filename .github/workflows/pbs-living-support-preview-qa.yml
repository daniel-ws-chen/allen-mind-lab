name: PBS Living Support preview QA
on:
  push:
    branches: [feature/pbs-living-support]
permissions:
  contents: read
jobs:
  site-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare existing main and feature site validation
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/aml-site-qa
          git worktree add --detach /tmp/aml-main-baseline origin/main || exit 1
          (cd /tmp/aml-main-baseline && node validate-aml.mjs) > /tmp/aml-site-qa/main.log 2>&1
          baseline=$?
          node validate-aml.mjs > /tmp/aml-site-qa/feature.log 2>&1
          candidate=$?
          cat /tmp/aml-site-qa/main.log
          cat /tmp/aml-site-qa/feature.log
          grep '^✗ ' /tmp/aml-site-qa/main.log | sort > /tmp/aml-site-qa/main-errors.txt
          grep '^✗ ' /tmp/aml-site-qa/feature.log | sort > /tmp/aml-site-qa/feature-errors.txt
          comm -13 /tmp/aml-site-qa/main-errors.txt /tmp/aml-site-qa/feature-errors.txt > /tmp/aml-site-qa/new-errors.txt
          echo "Main exit: $baseline; feature exit: $candidate"
          echo "New error lines:"
          cat /tmp/aml-site-qa/new-errors.txt
          if [ "$candidate" -ne 0 ]; then exit "$candidate"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aml-site-baseline-comparison
          path: /tmp/aml-site-qa/
          retention-days: 7
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-pbs-living-support.mjs
      - name: Simulate production build without deployment
        run: |
          node build-dist.mjs
          for f in pbs-living-support.html pbs-living-support.css pbs-living-support.js pbs-living-support-ai.js pbs-living-support-cards.js pbs-living-support-export.js pbs-living-support-import.js pbs-living-support-rules.js pbs-companion-web.html pbs-companion-web.js tools.html; do
            test -s "dist/$f"
          done
          grep -q 'pbs-living-support.html' dist/tools.html
          grep -q 'pbs-living-support.html' dist/pbs-companion-web.html
          grep -q 'pbs-living-support-ai.js' dist/pbs-living-support.html
          echo "Production build includes all PBS runtime files and both entrances."
      - run: npm install --no-save --ignore-scripts playwright@1.56.1 mammoth@1.13.0 https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz axe-core@4.10.3
      - run: npx playwright install --with-deps chromium
      - name: Prepare synthetic office documents and compatibility tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer libreoffice-calc fonts-noto-cjk poppler-utils
          mkdir -p /tmp/pbs-fixtures /tmp/pbs-rendered
          printf '需要休息時使用休息卡\n' > /tmp/pbs-fixtures/fixture.txt
          libreoffice -env:UserInstallation=file:///tmp/pbs-fixture-profile --headless --convert-to docx --outdir /tmp/pbs-fixtures /tmp/pbs-fixtures/fixture.txt
          printf '目標,說明\n休息卡,需要休息時使用\n' > /tmp/pbs-fixtures/fixture.csv
          libreoffice -env:UserInstallation=file:///tmp/pbs-fixture-profile --headless --convert-to xlsx --outdir /tmp/pbs-fixtures /tmp/pbs-fixtures/fixture.csv
          test -s /tmp/pbs-fixtures/fixture.docx
          test -s /tmp/pbs-fixtures/fixture.xlsx
      - run: node scripts/validate-pbs-living-support-browser.mjs
      - name: Open generated ODT files in LibreOffice
        run: |
          for name in checklist easy-read guide custom-photo mono-checklist mono-easy; do
            unzip -t /tmp/pbs-qa/$name.odt
            libreoffice -env:UserInstallation=file:///tmp/pbs-output-profile --headless --convert-to pdf --outdir /tmp/pbs-rendered /tmp/pbs-qa/$name.odt
            test -s /tmp/pbs-rendered/$name.pdf
            pdftotext /tmp/pbs-rendered/$name.pdf /tmp/pbs-rendered/$name.txt
            grep -q '休息' /tmp/pbs-rendered/$name.txt
            pdfinfo /tmp/pbs-rendered/$name.pdf | grep 'Page size'
          done
          pdfimages -list /tmp/pbs-rendered/custom-photo.pdf
          test "$(pdfimages -list /tmp/pbs-rendered/custom-photo.pdf | tail -n +3 | wc -l)" -ge 1
      - name: Package independent manual acceptance preview
        run: |
          mkdir -p /tmp/pbs-manual-preview
          cp dist/pbs-living-support* dist/pbs-companion-web.html dist/pbs-companion-web.js dist/pbs-companion-web.css /tmp/pbs-manual-preview/
          mkdir -p /tmp/pbs-manual-preview/vendor
          cp node_modules/mammoth/mammoth.browser.min.js /tmp/pbs-manual-preview/vendor/
          cp node_modules/xlsx/dist/xlsx.full.min.js /tmp/pbs-manual-preview/vendor/
          cp node_modules/mammoth/LICENSE* /tmp/pbs-manual-preview/vendor/mammoth-LICENSE
          cp node_modules/xlsx/LICENSE* /tmp/pbs-manual-preview/vendor/xlsx-LICENSE
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/pbs-manual-preview')
          for name in ('pbs-living-support.html','pbs-companion-web.html'):
              p=root/name
              s=p.read_text()
              s=s.replace('https://cdn.jsdelivr.net/npm/mammoth@1.13.0/mammoth.browser.min.js','vendor/mammoth.browser.min.js')
              s=s.replace('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js','vendor/xlsx.full.min.js')
              p.write_text(s)
          (root/'README.txt').write_text('AML PBS manual acceptance preview. Extract ZIP, then open pbs-living-support.html. Use synthetic or de-identified data only. Standalone preview; other AML site links may not work. For cross-tool sessionStorage testing, serve this directory via localhost HTTP. PDF uses browser print. External AI collaboration requires manual copy/paste. Not a production release.\n')
          PY
          (cd /tmp/pbs-manual-preview && sha256sum vendor/*.js > SHA256SUMS.txt)
      - name: Preserve manual acceptance preview
        uses: actions/upload-artifact@v4
        with:
          name: pbs-manual-acceptance-preview
          path: /tmp/pbs-manual-preview/
          retention-days: 7
      - name: Preserve synthetic QA documents
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pbs-synthetic-document-qa
          path: |
            /tmp/pbs-qa/
            /tmp/pbs-rendered/
          if-no-files-found: ignore
          retention-days: 7
