name: AML Kids QA

on:
  push:
    branches: [main]
    paths:
      - 'aml-kids/**'
      - '.github/workflows/aml-kids-qa.yml'
  pull_request:
    paths:
      - 'aml-kids/**'
      - '.github/workflows/aml-kids-qa.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate AML Kids
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate site structure
        shell: bash
        run: |
          set +e
          node aml-kids/validate-aml-kids.mjs 2>&1 | tee aml-kids-structure.log
          status=${PIPESTATUS[0]}
          {
            echo "### AML Kids site structure"
            echo "\`\`\`text"
            cat aml-kids-structure.log
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Validate question content
        if: always()
        shell: bash
        run: |
          set +e
          node aml-kids/validate-aml-kids-content.mjs 2>&1 | tee aml-kids-content.log
          status=${PIPESTATUS[0]}
          {
            echo "### AML Kids question content"
            echo "\`\`\`text"
            cat aml-kids-content.log
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Validate visual challenges
        if: always()
        shell: bash
        run: |
          set +e
          node aml-kids/validate-aml-kids-visual.mjs 2>&1 | tee aml-kids-visual.log
          status=${PIPESTATUS[0]}
          {
            echo "### AML Kids visual challenges"
            echo "\`\`\`text"
            cat aml-kids-visual.log
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
