<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">從知識工作者到判斷工作者：AI正在改寫我們的專業價值</title><desc id="d">管理學，正在成為判斷工作者不可或缺的基礎素養</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#18324f"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c7a76a"/><stop offset="1" stop-color="#edd9a4"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1330" cy="140" r="290" fill="#315d8b" opacity=".22"/><circle cx="1450" cy="780" r="360" fill="#c7a76a" opacity=".08"/>
<rect x="78" y="70" width="120" height="64" rx="8" fill="#fff"/><text x="138" y="114" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#0d1b2a" text-anchor="middle">AML</text>
<text x="225" y="103" font-family="Arial,'Noto Sans TC',sans-serif" font-size="27" fill="#fff">Allen Mind Lab · Building A Meaningful Life.</text>
<text x="80" y="250" font-family="Arial,'Noto Sans TC',sans-serif" font-size="74" font-weight="800" fill="#fff">從知識工作者</text>
<text x="80" y="345" font-family="Arial,'Noto Sans TC',sans-serif" font-size="82" font-weight="800" fill="url(#g)">到判斷工作者</text>
<text x="80" y="420" font-family="Arial,'Noto Sans TC',sans-serif" font-size="42" font-weight="700" fill="#d7e2ef">AI正在改寫我們的專業價值</text>
<rect x="80" y="470" width="980" height="74" rx="37" fill="#102944" stroke="#c7a76a" stroke-width="2"/><text x="115" y="518" font-family="Arial,'Noto Sans TC',sans-serif" font-size="30" fill="#fff">管理學，正在成為判斷工作者不可或缺的基礎素養</text>
<g transform="translate(1040 210)">
<rect width="470" height="440" rx="30" fill="#fff" opacity=".96"/>
<text x="36" y="58" font-family="Arial,'Noto Sans TC',sans-serif" font-size="27" font-weight="700" fill="#0d1b2a">AI 可以快速產生選項</text>
<line x1="48" y1="102" x2="420" y2="102" stroke="#d8dee8"/>
<text x="50" y="155" font-family="Arial,'Noto Sans TC',sans-serif" font-size="25" fill="#315d8b">SWOT 分析</text><text x="330" y="155" font-family="Arial,sans-serif" font-size="26" fill="#c7a76a">→</text>
<text x="50" y="210" font-family="Arial,'Noto Sans TC',sans-serif" font-size="25" fill="#315d8b">策略方案</text><text x="330" y="210" font-family="Arial,sans-serif" font-size="26" fill="#c7a76a">→</text>
<text x="50" y="265" font-family="Arial,'Noto Sans TC',sans-serif" font-size="25" fill="#315d8b">風險評估</text><text x="330" y="265" font-family="Arial,sans-serif" font-size="26" fill="#c7a76a">→</text>
<rect x="35" y="310" width="400" height="92" rx="18" fill="#f6f1e8"/><text x="235" y="349" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif" font-size="22" fill="#6a5731">真正稀缺的是</text><text x="235" y="382" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif" font-size="31" font-weight="800" fill="#0d1b2a">判斷與選擇</text></g>
<g font-family="Arial,'Noto Sans TC',sans-serif" fill="#fff" font-size="25">
<text x="90" y="665">判斷 → 試作 → 觀察 → 修正 → 再判斷</text>
<text x="90" y="720">教育評量：從「答案完整」轉向看見學生的「判斷痕跡」</text>
<text x="90" y="775">面對知識的紅海，我們更要學會謙卑地做出選擇。</text></g>
<text x="80" y="845" font-family="Arial,'Noto Sans TC',sans-serif" font-size="20" fill="#aeb8c5">Allen Mind Lab · 2026.10.04</text></svg>