<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c2546"/><stop offset="1" stop-color="#145d82"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><circle cx="1040" cy="90" r="190" fill="#ffffff" opacity=".05"/><circle cx="80" cy="610" r="220" fill="#ffffff" opacity=".04"/><text x="70" y="75" font-size="27" fill="#f3d695" >AML  Allen Mind Lab  ｜  統計學系列・第92篇</text><text x="70" y="185" font-size="74" fill="#ffffff" font-weight="700">住在天龍國，</text><text x="70" y="275" font-size="74" fill="#ffffff" font-weight="700">人人都是有錢人？</text><text x="70" y="330" font-size="26" fill="#dce9f5" >描述統計學入門｜集中趨勢・離散程度・資料分布</text><rect x="70" y="375" width="500" height="150" rx="18" fill="#ffffff" opacity=".12"/><rect x="625" y="375" width="500" height="150" rx="18" fill="#ffffff" opacity=".12"/><text x="100" y="425" font-size="32" fill="#f9dd9e" >均富里｜所得集中</text><text x="100" y="470" font-size="29" fill="#ffffff" >關注共同生活品質</text><text x="655" y="425" font-size="32" fill="#f9dd9e" >天龍里｜所得分散</text><text x="655" y="470" font-size="29" fill="#ffffff" >關注可能被忽略的需求</text><text x="70" y="585" font-size="31" fill="#ffffff" >同樣平均所得10萬元，為何兩位里長想出不同政策？</text><text x="70" y="634" font-size="29" fill="#f9dd9e" >數字沒有改變，改變的是我們理解問題的方式。</text></svg>