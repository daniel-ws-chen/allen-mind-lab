.choice:before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:6px;border-radius:999px;background:linear-gradient(180deg,#94d9e3,#4da8b4);opacity:.75}
.choice:hover,.choice:focus-visible{transform:translateY(-1px);border-color:#59a8b6;background:linear-gradient(180deg,#ffffff 0%,#effafb 100%);outline:none;box-shadow:0 10px 20px rgba(32,89,108,.1)}
.choice:disabled{opacity:.55;cursor:default}
.reaction{text-align:center;padding:14px 0 6px}.resultTitle{font-size:clamp(30px,6vw,48px);font-weight:1000;margin:6px 0 10px}.resultText{font-size:clamp(22px,4vw,30px);font-weight:900;line-height:1.55;background:linear-gradient(180deg,#f3f8fa 0%,#ebf3f5 100%);padding:24px;border-radius:22px;border:1px solid #d8e6ea}.good{color:var(--good)}.bad{color:var(--bad)}.neutral{color:var(--warn)}
.act{width:100%;border:0;background:linear-gradient(135deg,#14758a 0%,#0f6172 100%);color:white;font:900 20px inherit;border-radius:18px;padding:16px 18px;cursor:pointer;margin-top:18px;box-shadow:0 10px 18px rgba(18,103,122,.22);transition:transform .14s ease,box-shadow .14s ease}
.act:hover,.act:focus-visible{transform:translateY(-1px);box-shadow:0 14px 24px rgba(18,103,122,.26);outline:3px solid #f4cf7a;outline-offset:2px}
.alt{background:linear-gradient(180deg,#eef6f8 0%,#e1edf0 100%);color:#17475a;box-shadow:0 8px 14px rgba(23,71,90,.08)}
.meta{font-size:13px;color:#627681;text-align:center;margin-top:14px;line-height:1.6}.meter{display:flex;gap:8px;margin:16px 0 4px}.meter span{flex:1;height:12px;border-radius:999px;background:linear-gradient(180deg,#dce9ec,#cadbdf)}.meter span.on{background:linear-gradient(180deg,#f4c36e,#e49334);box-shadow:0 0 0 2px rgba(255,255,255,.3) inset}.pill{display:inline-block;border-radius:999px;padding:7px 12px;background:#e2f0f2;font-weight:900;font-size:14px;margin:8px 0}
details{margin-top:18px;border-top:1px dashed #d6e4e8;padding-top:14px;color:#425b69;background:linear-gradient(180deg,#fbfefd 0%,#f5fafb 100%);border-radius:18px;padding:14px 16px}summary{cursor:pointer;font-weight:900}li{margin:8px 0}
button:focus-visible{outline:3px solid #e29c2f;outline-offset:3px}

.mapTitle{text-align:center;font-size:clamp(30px,5vw,42px);font-weight:1000;margin:4px 0 8px;color:#11384a}.mapLead{text-align:center;color:#4f6772;font-size:16px;line-height:1.6;margin:0 0 12px}
.mapButtons{display:flex;gap:10px;justify-content:center}.tinyBtn{background:linear-gradient(180deg,#eff6f8,#e4eef1);border:1px solid #c6dbe0;padding:11px 16px;font:800 14px inherit;border-radius:13px;cursor:pointer;color:#1c495d;box-shadow:0 5px 12px rgba(23,71,90,.07)}.tinyBtn:hover{transform:translateY(-1px)}

.adventure{position:relative;isolation:isolate;overflow:hidden;border-radius:34px;padding:20px 16px 28px;background:
 linear-gradient(180deg,#bdeaf1 0%,#a6ddea 36%,#77c0d0 100%);border:2px solid #7ab8c6;min-height:700px;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 16px 30px rgba(48,111,129,.12)}
.adventure:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.42;background:
 radial-gradient(circle at 18% 16%,#ffffff 0 4%,transparent 4.5%),
 radial-gradient(circle at 83% 26%,#ffffff 0 3.2%,transparent 3.7%),
 radial-gradient(circle at 69% 78%,#ffffff 0 2.3%,transparent 2.8%),
 radial-gradient(circle at 35% 70%,rgba(255,255,255,.22) 0 10%,transparent 10.5%),
 linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 55%)}
.adventure:after{content:"";position:absolute;inset:12px;border-radius:28px;border:1px dashed rgba(255,255,255,.22);pointer-events:none}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.mapHud{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.76);backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.5);border-radius:18px;padding:12px 15px;margin-bottom:22px;font-weight:900;box-shadow:0 12px 20px rgba(39,97,112,.1)}
.mapHint{font-size:12px;font-weight:700;color:#3b6273}
.journey{position:relative;max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr;row-gap:12px;column-gap:24px;padding:6px 4px 10px}
.journey:before{content:"";position:absolute;left:50%;top:24px;bottom:36px;width:6px;transform:translateX(-50%);border-radius:999px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.7) 0 16px,rgba(68,131,146,.0) 16px 30px);box-shadow:0 0 0 2px rgba(123,178,189,.18)}
.mapNode{position:relative;min-width:0;display:flex}.mapNode:nth-child(4n+1),.mapNode:nth-child(4n+4){justify-content:center}.mapNode:nth-child(4n+2){justify-content:flex-end}.mapNode:nth-child(4n+3){justify-content:flex-start}.mapNode:nth-child(even){transform:translateY(26px)}
.mapNode:before{content:"";position:absolute;top:50%;width:72px;height:16px;transform:translateY(-50%);pointer-events:none;background:linear-gradient(90deg,transparent 0 10%,rgba(255,255,255,.78) 10% 16%,transparent 16% 30%,rgba(255,255,255,.65) 30% 36%,transparent 36% 100%)}
.mapNode:nth-child(odd):before{right:-34px}.mapNode:nth-child(even):before{left:-34px;transform:translateY(-50%) scaleX(-1)}
.mapNode:last-child:before{display:none}
.islandCard{position:relative;display:flex;flex-direction:column;text-align:center;align-items:center;justify-content:center;gap:5px;color:#173044;width:min(100%,285px);min-height:154px;padding:18px 12px 22px;border-radius:46% 54% 46% 49% / 36% 33% 45% 44%;cursor:pointer;font:inherit;border:3px solid rgba(255,255,255,.86);box-shadow:0 12px 0 rgba(60,127,115,.9),0 18px 24px rgba(34,83,96,.16);transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}
.islandCard:not(:disabled):hover{transform:translateY(-4px) scale(1.01);box-shadow:0 14px 0 rgba(60,127,115,.9),0 24px 28px rgba(34,83,96,.18);filter:saturate(1.04)}
.islandCard:disabled{background:linear-gradient(145deg,#e8eded,#d3dedb)!important;border-color:#eef4f2;color:#62757c;cursor:not-allowed;box-shadow:0 11px 0 #7a9ba0,0 16px 24px rgba(34,83,96,.1)}
.mapNode:nth-child(1) .islandCard{background:linear-gradient(145deg,#f9ffe4,#d8f2bf)}

.mapNode:nth-child(3) .islandCard{background:linear-gradient(145deg,#fde2ef,#f1bfd7);box-shadow:0 12px 0 #b06b8f,0 18px 24px rgba(34,83,96,.16)}
.mapNode:nth-child(4) .islandCard{background:linear-gradient(145deg,#e6f0ff,#b9d3ff);box-shadow:0 12px 0 #6f8ec0,0 18px 24px rgba(34,83,96,.16)}
.mapNode:nth-child(5) .islandCard{background:linear-gradient(145deg,#fff1dd,#edca99);box-shadow:0 12px 0 #b78958,0 18px 24px rgba(34,83,96,.16)}
.mapNode:nth-child(6) .islandCard{background:linear-gradient(145deg,#e4f9f2,#bfe8d8);box-shadow:0 12px 0 #5d9b86,0 18px 24px rgba(34,83,96,.16)}
.mapNode:nth-child(7) .islandCard{background:linear-gradient(145deg,#f0e4ff,#d8c1fa);box-shadow:0 12px 0 #8c6cb3,0 18px 24px rgba(34,83,96,.16)}
.islandEmoji{font-size:45px;line-height:1;filter:drop-shadow(0 4px 10px rgba(255,255,255,.2))}
.islandDetails{display:flex;flex-direction:column;gap:3px}.islandName{font-size:16px;font-weight:1000;line-height:1.35}.islandLabel{font-size:12px;font-weight:800;color:#23495a}.nodeNum{position:absolute;top:7px;left:18px;background:#22546a;color:#fff;border-radius:50%;width:29px;height:29px;display:grid;place-items:center;font-size:12px;font-weight:1000;box-shadow:0 4px 8px rgba(11,40,55,.2)}.nodeStars{position:absolute;top:9px;right:16px;font-size:16px;color:#bb760c;text-shadow:0 1px 0 #fff}
.bossCard{background:linear-gradient(145deg,#402436,#8c3b49 48%,#f0ad59)!important;color:#fff;border-color:#ffd7b3;box-shadow:0 12px 0 #702b35,0 22px 28px rgba(34,83,96,.2)!important}
/* v3.4 island individuality */
.islandCard{overflow:visible;padding-top:72px;padding-bottom:18px;isolation:isolate}
.island3d{position:absolute;left:50%;top:-16px;transform:translateX(-50%);width:118px;height:86px;pointer-events:none;filter:drop-shadow(0 9px 15px rgba(19,64,78,.16))}
.island3d:before{content:"";position:absolute;inset:10px 8px 0;border-radius:55% 45% 48% 52% / 58% 42% 58% 42%;background:linear-gradient(180deg,rgba(255,255,255,.9) 0 18%,#f7e2a2 18% 31%,#7dcf8f 31% 100%);box-shadow:0 10px 0 rgba(104,152,95,.95),0 16px 16px rgba(25,76,87,.12)}
.island3d:after{content:"";position:absolute;left:18px;right:18px;bottom:-3px;height:18px;border-radius:50%;background:rgba(17,58,69,.16);filter:blur(6px);z-index:-1}
.terrainIcon,.featureIcon,.island3d .islandEmoji{position:absolute;display:grid;place-items:center}
.terrainIcon{left:9px;top:8px;font-size:24px}
.featureIcon{right:10px;top:12px;font-size:22px}
.island3d .islandEmoji{left:50%;top:24px;transform:translateX(-50%);font-size:35px;line-height:1;filter:drop-shadow(0 3px 7px rgba(255,255,255,.28))}
.islandAccent{display:inline-block;margin-top:4px;font-size:11px;font-weight:900;color:#315466;background:rgba(255,255,255,.45);padding:3px 8px;border-radius:999px}
.islandCard:hover .island3d{transform:translateX(-50%) translateY(-2px)}
.mapNode .islandCard{border-radius:44% 56% 43% 57% / 35% 34% 50% 48%}
.isle-shore{border-radius:46% 54% 41% 59% / 31% 39% 48% 52% !important}
.isle-shore .island3d:before{background:linear-gradient(180deg,#fff7da 0 18%,#f1d17c 18% 30%,#87d98d 30% 100%);box-shadow:0 10px 0 #6fa46c,0 16px 16px rgba(25,76,87,.12)}
.isle-study{border-radius:52% 48% 43% 57% / 42% 29% 53% 47% !important}

.isle-study .terrainIcon{font-size:22px;left:12px;top:10px}

.bossCard{padding-top:72px}

/* v3.5 exploration feel and differentiated states */
.routeMap path{animation:routeDrift 18s linear infinite}
.routeMap .routeShadow{animation:none}
@keyframes routeDrift{from{stroke-dashoffset:0}to{stroke-dashoffset:-220}}
.activeGoal .islandCard:not(:disabled){outline:4px solid rgba(255,243,171,.85);outline-offset:5px;animation:goalPulse 1.8s ease-in-out infinite}
.done .islandCard{filter:saturate(1.05)}
.lockedZone .islandCard,.stateLocked{filter:grayscale(.18) saturate(.65) brightness(.97)}
.stateDone{box-shadow:0 13px 0 #3f8f5d,0 19px 25px #20546740!important}
.stateDone .islandAccent{background:rgba(227,255,230,.75);color:#255c38}
.stateDone .nodeStars{font-size:18px;text-shadow:0 0 10px rgba(255,221,112,.6),0 1px 0 #fff}
.stateDone .island3d:before{box-shadow:0 10px 0 rgba(81,150,83,.96),0 0 0 4px rgba(255,255,255,.34) inset,0 16px 16px rgba(25,76,87,.12)}
.stateDone:after{background:#0a7a454a}

const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(arr){return arr.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x)}
function meter(n){return '<div class="meter" role="meter" aria-valuemin="0" aria-valuemax="3" aria-valuenow="'+n+'" aria-label="危機強度 '+n+' / 3">'+[1,2,3].map(i=>'<span class="'+(i<=n?'on':'')+'"></span>').join('')+'</div>'}

// 航線以實際地圖節點為準；不依賴固定座標，避免 4→5→6 路徑錯位。
function alignIslandRoute(){
 const map=document.querySelector('.adventure'), svg=map?.querySelector('.routeMap');
 if(!map||!svg)return;
 const nodes=[...map.querySelectorAll('.journey .mapNode')];
 if(nodes.length!==8)return;
 const frame=map.getBoundingClientRect();
 const pts=nodes.map((node)=>{
   const image=node.querySelector('.dioramaScene')||node.querySelector('.islandCard');
   const r=image.getBoundingClientRect();
   return {x:r.left+r.width/2-frame.left,y:r.top+r.height*.59-frame.top};
 });
 const w=map.clientWidth,h=map.clientHeight;
 svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
 svg.setAttribute('preserveAspectRatio','none');
 // 每個相鄰站點各自有一段路線，4→5→6 可直接核對。
 const commands=[];
 for(let i=0;i<pts.length-1;i++){
   const a=pts[i],b=pts[i+1],dx=b.x-a.x,dy=b.y-a.y;
   const bend=Math.min(34,Math.abs(dx)*.13);
   const midY=(a.y+b.y)/2;
   commands.push(`M ${a.x.toFixed(1)} ${a.y.toFixed(1)} C ${(a.x+Math.sign(dx)*bend).toFixed(1)} ${midY.toFixed(1)}, ${(b.x-Math.sign(dx)*bend).toFixed(1)} ${midY.toFixed(1)}, ${b.x.toFixed(1)} ${b.y.toFixed(1)}`);
 }
 const d=commands.join(' ');
 svg.querySelectorAll('path').forEach(p=>p.setAttribute('d',d));
}
let routeResizeFrame=0;
window.addEventListener('resize',()=>{
 cancelAnimationFrame(routeResizeFrame);
 routeResizeFrame=requestAnimationFrame(alignIslandRoute);
});

const bossH=b=>String(b).replaceAll('「','').replaceAll('」','');
function bossIntro(){if(completed.size<levels.length)return;phase='bossIntro';status.textContent='魔王島';screen.innerHTML=`<div class="step">🌋 最終魔王島</div><div class="portrait">🌋</div><div class="bubble">雙重功能 × 進階混合挑戰</div><p class="prompt">五場 BOSS 戰，每戰三回合。完成整場後才會出現檢查點。<br>短暫緩和不代表兩項需求都獲支持。</p><p class="bossHint">此為虛構劇情，僅訓練判斷，不預測真實反應。</p><button class="act" onclick="bossStart()">⚔️ 開始魔王戰</button><button class="act alt" onclick="home()">回闖關地圖</button>`}
function bossStart(){bossGame={round:0,turn:0,risk:0,covered:new Set(),log:[],waiting:false,checkpoint:null};bossSaveCheckpoint();bossQuestion()}
function bossSaveCheckpoint(){const g=bossGame;g.checkpoint={round:g.round,risk:g.risk,logLength:g.log.length}}
function bossRetryRound(){const g=bossGame;if(!g?.checkpoint){bossStart();return}const c=g.checkpoint;g.round=c.round;g.turn=0;g.risk=c.risk;g.covered=new Set();g.log=g.log.slice(0,c.logLength);g.waiting=false;bossQuestion()}
function bossIntermission(){const g=bossGame;phase='bossIntermission';status.textContent='已通過 '+g.round+' / '+bossRounds.length+' 場';
screen.innerHTML=`<div class="bossCheckpoint" role="status"><div class="checkIcon">⭐</div><h2>第 ${g.round} 戰 CLEAR!</h2><p>兩項功能假設已納入適切支持策略</p><div class="checkLine">進度 ${g.round} / ${bossRounds.length}　·　下一關：${escapeHTML(bossRounds[g.round].title)}</div></div><button class="act" onclick="bossQuestion()">⚔️ 挑戰下一場</button><button class="act alt" onclick="home()">🏝️ 結束本次，返回地圖</button><p class="meta">檢查點僅供本次魔王挑戰失敗時重試；返回地圖不會儲存魔王進度。</p>`}

function bossBranchScene(g){const b=bossRounds[g.round]; const prior=g.log[g.log.length-1];if(!prior)return b.turns[1].scene;if(g.round>=3)return b.turns[g.turn].scene;const covered=prior.needs||[]; if(g.round===0)return covered.includes(0)?'影片接近尾聲，小安不再喊叫，卻一直摀著耳朵。':covered.includes(1)?'小安不再摀耳，卻繼續盯著電視不願離開。':'小安提高音量，仍抱住遙控器。';if(g.round===1)return covered.includes(0)?'物品有了處理方向，阿泰卻一直望向同仁。':covered.includes(1)?'阿泰願意靠近工作人員，仍抓著別人的拼圖。':'阿泰又敲桌，頻繁看向工作人員。';return covered.includes(0)?'小安稍微安靜了，卻仍不讓人靠近。':covered.includes(1)?'小安聽見有人陪伴，卻皺眉避開新的要求。':'小安坐著不說話，緊握雙拳。'}
function bossRiskDisplay(risk){const level=Math.max(0,Math.min(4,risk));const percent=Math.round(level/3*100);const text=level===0?'目前平穩':level===1?'需要留意':level===2?'危機升高':'危機臨界';return `<div class="bossRisk" data-risk="${level}" role="group" aria-label="模擬危機狀態"><div class="bossRiskHead"><span>🌡️ 危機升溫條</span><span>${text}</span></div><div class="bossRiskTrack" role="progressbar" aria-label="情境危機程度" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${Math.min(3,level)}" aria-valuetext="${text}"><div class="bossRiskFill" style="--danger:${Math.min(100,percent)}%"></div></div><div class="bossRiskDesc">僅為遊戲劇本中的危機指標，不是臨床評估，也不保證真實結果。</div></div>`}
function bossQuestion(){if(!bossGame||bossGame.round>=bossRounds.length)return;phase='bossQuestion';const g=bossGame,b=bossRounds[g.round],t=b.turns[g.turn];status.textContent=`BOSS ${g.round+1}/${bossRounds.length} · ${g.turn+1}/${b.turns.length}`;
let reordered=shuffle(t.choices.map((c,i)=>({c,i}))); const sceneText=g.turn===0?b.opening:(g.turn===1?bossBranchScene(g):t.scene);
screen.innerHTML=`<div class="step">${escapeHTML(b.title)} · ${g.turn+1}/${b.turns.length}</div><div class="portrait">${b.icon}</div><div class="bubble" style="white-space:pre-line">${escapeHTML(sceneText)}</div><div class="prompt">${t.mode==='communication'||!t.mode?'六字內，你會說什麼？':t.mode==='analysis'?'辨識雙重功能假設':t.mode==='team'?'選擇團隊評估方案':'選擇整合支持策略'}</div><div class="choices">${reordered.map(o=>`<button class="choice ${t.mode&&t.mode!=='communication'?'bossChoiceLong':'bossChoice'}" onclick="bossChoose(${o.i})">${escapeHTML(o.c.say)} ${!t.mode||t.mode==='communication'?`<small style="font-size:13px;color:#63747b">${Array.from(bossH(o.c.say)).length}字</small>`:''}</button>`).join('')}</div>${bossRiskDisplay(g.risk)}`}
function bossChoose(i){if(phase!=='bossQuestion')return;const g=bossGame,b=bossRounds[g.round],c=b.turns[g.turn].choices[i];if((!b.turns[g.turn].mode||b.turns[g.turn].mode==='communication')&&Array.from(bossH(c.say)).length>6){alert('魔王島口語回應不得超過六字');return} // A choice that escalates risk is not evidence of appropriate support, even if a function is mentioned.
if(c.delta<=0)c.needs.forEach(n=>g.covered.add(n));g.risk=Math.max(0,Math.min(4,g.risk+c.delta));g.log.push({round:g.round,turn:g.turn,say:c.say,reply:c.reply,tip:c.tip,needs:c.needs,appropriate:c.delta<=0});
let partial=g.turn>=1&&g.covered.size<2;let reaction=c.reply;
if(g.turn===1 && partial && g.risk<3){g.risk=Math.min(4,g.risk+1);reaction+=' 剛緩和的反應又開始波動。'}
if(g.turn===2 && partial && g.risk<3){g.risk=Math.min(4,g.risk+1);reaction+=' 另一項需求仍可能造成後續困難。'}
const fail=g.risk>=3;g.waiting=fail;phase='bossReaction';screen.innerHTML=`<div class="step">${escapeHTML(b.title)} · 接著出現的反應</div><section class="stormStage" data-risk="${Math.min(g.risk,4)}">${characterScene(fail?'🌪️':g.risk===0?'😌':'😟',fail?'crisis':g.risk===0?'calm':'uneasy',fail?'風暴警示':'持續觀察')}<div class="stormEvent">${fail?'風暴警示':partial?'尚有需求未獲回應':'持續觀察中'}</div><div class="bossReaction">${escapeHTML(reaction)}</div></section><div class="bossResultBanner ${!fail&&g.risk===0?'safe':''}" role="status">${fail?'⚡ 危機升溫！':partial?'⚠️ 暫時緩和，仍有需求':'情境持續發展…'}</div>${bossRiskDisplay(g.risk)}<button class="act" onclick="bossNext()">${fail?'查看結果':'下一步 →'}</button>`}
function bossNext(){
 const g=bossGame;
 if(g.waiting){bossEnd(false,'危機已達臨界，先回顧安全與支持策略。');return}
 g.turn++;
 if(g.turn>=bossRounds[g.round].turns.length){
   if(g.covered.size<2){
      g.log.push({round:g.round,turn:3,say:'回合檢核',reply:'尚未對兩項功能假設採取足夠的適切支持。',tip:'三回合內須對兩項功能假設採取適切支持；僅提及需求或短暫安靜都不代表支持完成。',needs:[]});
      bossEnd(false,'尚未對兩項功能假設採取足夠的適切支持；可重新挑戰並調整策略。');return;
   }
   g.round++;g.turn=0;g.covered=new Set();g.risk=Math.max(0,g.risk-1);
   if(g.round>=bossRounds.length){bossEnd(true);return}
   bossSaveCheckpoint();bossIntermission();return;
 }
 bossQuestion();
}
function bossEnd(success,reason=''){if(success)bossCleared=true;phase='bossEnd';status.textContent='魔王結局';let txt=success?'🌟 BOSS CLEAR！':'🌪️ 挑戰未完成！';screen.innerHTML=`${!success&&reason.startsWith('尚未')?'<section class="endingStage over" role="status"><div class="endingIcon" aria-hidden="true">🔎</div><div class="endingName">TRY AGAIN</div><p class="endingSub">尚未充分支持雙重功能假設</p></section>':endingScene(success,true)}${success?'<div class="masterAward" role="status"><div class="masterMedal" aria-hidden="true">🏅</div><strong>全島通關！</strong><span>PBS 冒險大師</span><small>七島星章 × 五場雙重功能挑戰</small><em>Building A Meaningful Life</em></div>':''}<p class="prompt">${success?'完成五場雙重功能挑戰！':escapeHTML(reason||'重新觀察兩項需求，換一條路線再試！')}</p>${!success&&bossGame.checkpoint?'<button class="act" onclick="bossRetryRound()">🔁 從本場重新挑戰</button>':''}<button class="act alt" onclick="bossStart()">🔄 從第一戰重來</button><button class="act alt" onclick="home()">🏝️ 返回地圖</button><details><summary>通關後看短句回應與專業決策解析</summary><div class="bossSummary"><p>五戰的行為功能假設（需依個案資料驗證）：</p><ol>${bossRounds.map(b=>`<li>${escapeHTML(b.title)}：${b.dual.map(escapeHTML).join(' ＋ ')}</li>`).join('')}</ol><p>你的選擇與劇本模擬反應（並非真實個案的預測）：</p><ol>${bossGame.log.map(e=>`<li><strong>${escapeHTML(e.say)}</strong> → ${escapeHTML(e.reply)}<div>${escapeHTML(e.tip)}</div></li>`).join('')}</ol><p>單一回應不必同時解決兩種需求；關鍵在連續觀察與支持。安全風險時應優先依專業及機構危機程序處理。本遊戲不提供真實行為預測。</p></div></details>`}

// Announce concise state changes, rather than reading the whole game screen on every mutation.
const gameAnnouncement=document.querySelector('#game-announcement');
let announcedState='';
const renderObserver=new MutationObserver(()=>{
  const currentState=phase+'|'+status.textContent;
  const changedScreen=currentState!==announcedState;
  if(changedScreen){
    announcedState=currentState;
    const labels={question:'請閱讀情境並選擇策略',reaction:'已顯示模擬反應與 PBS 提示',finish:'本次挑戰結果已顯示',bossQuestion:'魔王島新回合，請選擇策略',bossReaction:'魔王島回饋已顯示',bossEnd:'魔王島結果已顯示'};
    gameAnnouncement.textContent=(status.textContent||'PBS 闖關島')+'。'+(labels[phase]||'畫面已更新');
    // A transition must explicitly establish the new reading position.
    // Do not rely on the browser's transient body-focus state after innerHTML replacement.
    sceneFocus();
  }else if(!screen.contains(document.activeElement) &&
           (document.activeElement===document.body || !document.activeElement?.isConnected)){
    // An unexpected removal may also orphan keyboard focus.
    sceneFocus();
  }
});
renderObserver.observe(screen,{childList:true});
home();
</script></body></html>
