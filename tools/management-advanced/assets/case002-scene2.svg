<text x="420" y="392" text-anchor="middle" class="n" fill="#a34f49">35</text><text x="420" y="434" text-anchor="middle" class="small">今年</text>
<rect x="648" y="250" width="480" height="250" rx="26" fill="#fff3df" stroke="#dcc28d" stroke-width="3"/>
