<text x="120" y="115" class="cap">漂亮的數字</text><text x="570" y="115" class="cap">大家都很開心</text><text x="1020" y="115" class="cap">但資料變了</text><text x="120" y="413" class="cap">再看分母</text><text x="570" y="413" class="cap">再看定義</text><text x="1020" y="413" class="cap" style="fill:#dce8f2">FREEZE｜停一下</text>
