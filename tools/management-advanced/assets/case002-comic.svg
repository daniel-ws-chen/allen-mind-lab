<!--tip--><rect x="56" y="678" width="1288" height="220" rx="22" fill="#fffaf0" stroke="#d8cba9" stroke-width="4"/><circle cx="118" cy="739" r="42" fill="#f8e8c0"/><text x="118" y="753" text-anchor="middle" style="font:900 48px Arial">📊</text><rect x="176" y="706" width="430" height="66" rx="18" fill="#eef3f8" stroke="#cad6df" stroke-width="3"/><text x="206" y="747" class="sp" style="font-size:28px">數據提示</text><text x="188" y="812" class="sm">先確認：</text><text x="298" y="812" class="sm">樣本、分母、定義、時間範圍</text><text x="188" y="850" class="sm">再決定這個「變好」能不能成立。</text><rect x="928" y="712" width="344" height="126" rx="28" fill="#f28a2c" stroke="#fff" stroke-width="4"/><text x="1100" y="790" text-anchor="middle" style="font:900 43px 'Noto Sans TC','Microsoft JhengHei',Arial;fill:#fff">開始查數據 →</text>
