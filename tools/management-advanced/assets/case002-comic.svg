  <style>
    .p{fill:#fff;stroke:#23394a;stroke-width:4}.cap{font:900 24px 'Noto Sans TC','Microsoft JhengHei',Arial;fill:#4b5e72}.num{font:900 28px Arial;fill:#f3d78d}.bub{fill:#fff;stroke:#d5dcdf;stroke-width:2}.sp{font:800 25px 'Noto Sans TC','Microsoft JhengHei',Arial;fill:#203247}.sm{font:700 21px 'Noto Sans TC','Microsoft JhengHei',Arial;fill:#536476}.big{font:900 48px 'Noto Sans TC','Microsoft JhengHei',Arial;fill:#fff}.mid{font:800 30px 'Noto Sans TC','Microsoft JhengHei',Arial;fill:#dce8f2}
  </style>
</defs>
