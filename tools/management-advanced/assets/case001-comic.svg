<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef4f7"/>
      <stop offset="60%" stop-color="#eef4f7"/>
      <stop offset="60%" stop-color="#e7d4af"/>
      <stop offset="100%" stop-color="#e7d4af"/>
    </linearGradient>
    <linearGradient id="freeze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c355a"/>
      <stop offset="100%" stop-color="#31557f"/>
    </linearGradient>
    <style>
      .panel{stroke:#28435f;stroke-width:4}
      .cap{font:900 26px 'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;fill:#496175}
      .body{font:800 28px 'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;fill:#203246}
      .tiny{font:700 21px 'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;fill:#4e6172}
      .label{font:900 28px 'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;fill:#f4d790}
      .freezeTitle{font:900 48px 'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;fill:#ffffff}
      .freezeSub{font:800 30px 'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;fill:#eef4fc}
      .tag{font:900 23px Arial,sans-serif;fill:#efd48c}
    </style>
  </defs>
  <rect x="8" y="8" width="1384" height="964" rx="26" fill="#fffef9" stroke="#23394a" stroke-width="6"/>

  <!-- Panels -->
  <g>
    <rect x="40" y="72" width="420" height="270" rx="18" fill="url(#bg)" class="panel"/>
    <rect x="490" y="72" width="420" height="270" rx="18" fill="url(#bg)" class="panel"/>
    <rect x="940" y="72" width="420" height="270" rx="18" fill="url(#bg)" class="panel"/>
    <rect x="40" y="370" width="420" height="270" rx="18" fill="url(#bg)" class="panel"/>
    <rect x="490" y="370" width="420" height="270" rx="18" fill="url(#bg)" class="panel"/>
    <rect x="940" y="370" width="420" height="270" rx="18" fill="url(#freeze)" class="panel"/>
  </g>

  <!-- Number badges -->
  <g>
    <circle cx="82" cy="110" r="26" fill="#25466d"/><text x="82" y="119" text-anchor="middle" class="label">1</text>
    <circle cx="532" cy="110" r="26" fill="#25466d"/><text x="532" y="119" text-anchor="middle" class="label">2</text>
    <circle cx="982" cy="110" r="26" fill="#25466d"/><text x="982" y="119" text-anchor="middle" class="label">3</text>
    <circle cx="82" cy="408" r="26" fill="#25466d"/><text x="82" y="417" text-anchor="middle" class="label">4</text>
    <circle cx="532" cy="408" r="26" fill="#25466d"/><text x="532" y="417" text-anchor="middle" class="label">5</text>
    <circle cx="982" cy="408" r="26" fill="#25466d"/><text x="982" y="417" text-anchor="middle" class="label">6</text>
  </g>

  <text x="120" y="115" class="cap">董事會的新要求</text>
  <text x="570" y="115" class="cap">三個點子一起來</text>
  <text x="1020" y="115" class="cap">資源限制</text>
  <text x="120" y="413" class="cap">新資料進來了</text>
  <text x="570" y="413" class="cap">團隊開始取捨</text>
  <text x="1020" y="413" class="cap">FREEZE｜停一下</text>

  <!-- panel 1 -->
  <rect x="95" y="148" width="290" height="68" rx="16" fill="#fff" stroke="#d7dedf" stroke-width="2"/>
  <text x="113" y="189" class="body">「下季請推一個新服務。」</text>
  <rect x="108" y="236" width="110" height="76" rx="10" fill="#d3e6f0" stroke="#364c5e" stroke-width="4"/>
  <rect x="120" y="247" width="86" height="44" rx="7" fill="#f8faf9"/>
  <rect x="250" y="238" width="130" height="80" rx="18" fill="#9f7c57"/>
  <text x="314" y="297" text-anchor="middle" style="font:900 52px Arial;fill:#fff">👔</text>
  <text x="101" y="330" class="tiny">主任收到新任務。</text>

  <!-- panel 2 -->
  <rect x="542" y="145" width="300" height="86" rx="16" fill="#fff" stroke="#d7dedf" stroke-width="2"/>
  <text x="560" y="182" class="body">跌倒預防、照顧者團體、</text>
  <text x="560" y="214" class="body">線上諮詢。</text>
  <circle cx="590" cy="260" r="52" fill="#ffdfb8" stroke="#3e3e3e" stroke-width="3"/>
  <circle cx="720" cy="260" r="52" fill="#ffe4c3" stroke="#3e3e3e" stroke-width="3"/>
  <circle cx="850" cy="260" r="52" fill="#fde0bd" stroke="#3e3e3e" stroke-width="3"/>
  <text x="590" y="273" text-anchor="middle" style="font:900 50px Arial">🧑‍⚕️</text>
  <text x="720" y="273" text-anchor="middle" style="font:900 50px Arial">🧑‍💼</text>
  <text x="850" y="273" text-anchor="middle" style="font:900 50px Arial">📋</text>
  <text x="548" y="329" class="tiny">三個方向都有人提。</text>

  <!-- panel 3 -->
  <rect x="1000" y="140" width="300" height="80" rx="16" fill="#fff" stroke="#d7dedf" stroke-width="2"/>
  <text x="1020" y="177" class="body">每週只有 8 小時，</text>
  <text x="1020" y="209" class="body">三個方案無法一起做。</text>
  <rect x="1015" y="244" width="66" height="74" rx="10" fill="#d5a84b"/>
  <rect x="1102" y="218" width="66" height="100" rx="10" fill="#d5a84b"/>
  <rect x="1189" y="255" width="66" height="63" rx="10" fill="#d5a84b"/>
  <text x="1008" y="330" class="tiny">真正的問題：先做哪一個？</text>

  <!-- panel 4 -->
  <rect x="82" y="468" width="148" height="110" rx="16" fill="#e9f2ef" stroke="#acc7c1" stroke-width="3"/>
  <text x="156" y="505" text-anchor="middle" style="font:900 34px Arial;fill:#2e5f56">+35%</text>
  <text x="156" y="542" text-anchor="middle" class="body" style="font-size:24px">轉介需求</text>
  <rect x="264" y="468" width="148" height="110" rx="16" fill="#fdf2df" stroke="#d8c38c" stroke-width="3"/>
  <text x="338" y="505" text-anchor="middle" style="font:900 34px Arial;fill:#8d6220">1 個據點</text>
  <text x="338" y="542" text-anchor="middle" class="body" style="font-size:24px">願意合作</text>
  <text x="85" y="611" class="tiny">需求與機會開始浮現。</text>

  <!-- panel 5 -->
  <rect x="528" y="142" width="302" height="64" rx="16" fill="#fff" stroke="#d7dedf" stroke-width="2"/>
  <text x="546" y="183" class="body">需求重要，也要看做不做得動。</text>
  <rect x="534" y="512" width="160" height="92" rx="16" fill="#fce8e6" stroke="#e2b3ad" stroke-width="3"/>
  <text x="614" y="550" text-anchor="middle" style="font:900 34px Arial;fill:#a34f49">28 天</text>
  <text x="614" y="583" text-anchor="middle" class="body" style="font-size:24px">候診等待</text>
  <rect x="722" y="512" width="160" height="92" rx="16" fill="#eef3f8" stroke="#bccadc" stroke-width="3"/>
  <text x="802" y="550" text-anchor="middle" style="font:900 34px Arial;fill:#2f5074">加班↑</text>
  <text x="802" y="583" text-anchor="middle" class="body" style="font-size:24px">人力緊繃</text>
  <text x="540" y="620" class="tiny">要一起看「需求」和「限制」。</text>

  <!-- panel 6 -->
  <text x="1148" y="500" text-anchor="middle" class="freezeTitle">等等。</text>
  <text x="1148" y="560" text-anchor="middle" class="freezeSub">先選一個，才有機會做好。</text>
  <text x="1148" y="615" text-anchor="middle" class="freezeSub">現在換你做策略取捨。</text>
  <circle cx="1278" cy="476" r="38" fill="#fff" opacity="0.92"/>
  <circle cx="1278" cy="476" r="22" fill="none" stroke="#3c5d86" stroke-width="6"/>
  <line x1="1294" y1="492" x2="1320" y2="518" stroke="#3c5d86" stroke-width="8" stroke-linecap="round"/>

  <!-- bottom strip -->
  <rect x="56" y="678" width="1288" height="220" rx="22" fill="#fffaf0" stroke="#d8cba9" stroke-width="4"/>
  <circle cx="118" cy="739" r="42" fill="#f8e8c0"/>
  <text x="118" y="753" text-anchor="middle" style="font:900 48px Arial">🕵️</text>
  <rect x="176" y="706" width="364" height="66" rx="18" fill="#eef3f8" stroke="#cad6df" stroke-width="3"/>
  <text x="206" y="748" class="body" style="font-size:28px">策略提示</text>
  <text x="188" y="812" class="body" style="font-size:24px">先看：</text>
  <text x="276" y="812" class="body" style="font-size:24px">目標、需求、限制、資料</text>
  <text x="188" y="850" class="body" style="font-size:24px">再想：先做哪一個最合理。</text>
  <rect x="930" y="712" width="342" height="126" rx="28" fill="#f28a2c" stroke="#fff" stroke-width="4"/>
  <circle cx="988" cy="776" r="28" fill="#fff" opacity="0.96"/>
  <circle cx="988" cy="776" r="16" fill="none" stroke="#f28a2c" stroke-width="6"/>
  <line x1="999" y1="787" x2="1019" y2="807" stroke="#f28a2c" stroke-width="7" stroke-linecap="round"/>
  <text x="1120" y="790" text-anchor="middle" style="font:900 42px 'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;fill:#fff">開始取捨 →</text>
  <rect x="1164" y="28" width="176" height="44" rx="14" fill="#1c2f4d"/>
  <text x="1252" y="57" text-anchor="middle" class="tag">ALLEN MIND LAB</text>
</svg>
