<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#edf3f6"/>
      <stop offset="62%" stop-color="#edf3f6"/>
      <stop offset="62%" stop-color="#e3d1af"/>
      <stop offset="100%" stop-color="#e3d1af"/>
    </linearGradient>
    <linearGradient id="freeze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d355b"/>
      <stop offset="100%" stop-color="#2f547c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <style>
      .panel{fill:#fff;stroke:#23394a;stroke-width:4}.freezePanel{fill:url(#freeze);stroke:#23394a;stroke-width:4}
      .small{font:700 24px 'Noto Sans TC', 'Microsoft JhengHei', Arial, sans-serif; fill:#27384c}
      .tiny{font:700 20px 'Noto Sans TC', 'Microsoft JhengHei', Arial, sans-serif; fill:#566475}
      .title{font:900 52px 'Noto Sans TC', 'Microsoft JhengHei', Arial, sans-serif; fill:#10253f}
      .bubble{fill:#fff;stroke:#d9dfdf;stroke-width:2}
      .speech{font:800 26px 'Noto Sans TC', 'Microsoft JhengHei', Arial, sans-serif; fill:#213246}
      .label{font:900 28px 'Noto Sans TC', 'Microsoft JhengHei', Arial, sans-serif; fill:#f1d38c}
      .caption{font:900 24px 'Noto Sans TC', 'Microsoft JhengHei', Arial, sans-serif; fill:#4f6174}
      .freezeBig{font:900 48px 'Noto Sans TC', 'Microsoft JhengHei', Arial, sans-serif; fill:#fff}
      .freezeText{font:700 28px 'Noto Sans TC', 'Microsoft JhengHei', Arial, sans-serif; fill:#dce7f2}
      .tag{fill:#1c2f4d}
      .tagtext{font:900 24px Arial, sans-serif; fill:#f2d68f}
    </style>
  </defs>

  <rect x="5" y="5" width="1390" height="970" rx="26" fill="#fffef9" stroke="#23394a" stroke-width="6"/>

  <!-- Panels -->
  <g filter="url(#shadow)">
    <rect class="panel" x="40" y="72" width="420" height="270" rx="18" fill="url(#bg)"/>
    <rect class="panel" x="490" y="72" width="420" height="270" rx="18" fill="url(#bg)"/>
    <rect class="panel" x="940" y="72" width="420" height="270" rx="18" fill="url(#bg)"/>
    <rect class="panel" x="40" y="370" width="420" height="270" rx="18" fill="url(#bg)"/>
    <rect class="panel" x="490" y="370" width="420" height="270" rx="18" fill="url(#bg)"/>
    <rect class="freezePanel" x="940" y="370" width="420" height="270" rx="18"/>
  </g>

  <!-- panel numbers -->
  <g>
    <circle cx="82" cy="110" r="26" fill="#244164" stroke="#fff" stroke-width="4"/><text x="82" y="119" text-anchor="middle" class="label">1</text>
    <circle cx="532" cy="110" r="26" fill="#244164" stroke="#fff" stroke-width="4"/><text x="532" y="119" text-anchor="middle" class="label">2</text>
    <circle cx="982" cy="110" r="26" fill="#244164" stroke="#fff" stroke-width="4"/><text x="982" y="119" text-anchor="middle" class="label">3</text>
    <circle cx="82" cy="408" r="26" fill="#244164" stroke="#fff" stroke-width="4"/><text x="82" y="417" text-anchor="middle" class="label">4</text>
    <circle cx="532" cy="408" r="26" fill="#244164" stroke="#fff" stroke-width="4"/><text x="532" y="417" text-anchor="middle" class="label">5</text>
    <circle cx="982" cy="408" r="26" fill="#244164" stroke="#fff" stroke-width="4"/><text x="982" y="417" text-anchor="middle" class="label">6</text>
  </g>

  <!-- captions -->
  <text x="120" y="115" class="caption">董事會的新要求</text>
  <text x="570" y="115" class="caption">三個好點子一起來</text>
  <text x="1020" y="115" class="caption">資源限制</text>
  <text x="120" y="413" class="caption">新資料進來了</text>
  <text x="570" y="413" class="caption">團隊開始取捨</text>
  <text x="1020" y="413" class="caption">FREEZE｜停一下</text>

  <!-- Panel 1 content -->
  <rect x="105" y="235" width="112" height="74" rx="10" fill="#d8ebf2" stroke="#344b60" stroke-width="5"/>
  <rect x="117" y="246" width="88" height="42" rx="6" fill="#f8f8f2"/>
  <rect x="248" y="238" width="126" height="82" rx="18" fill="#9c7b58"/>
  <text x="291" y="300" text-anchor="middle" style="font:900 52px Arial; fill:#fff;">👔</text>
  <rect class="bubble" x="90" y="146" width="292" height="62" rx="16"/>
  <text x="110" y="185" class="speech">「下季請推出一個新服務。」</text>
  <text x="102" y="330" class="tiny">主任收到新任務。</text>

  <!-- Panel 2 -->
  <circle cx="590" cy="245" r="54" fill="#ffdfb8" stroke="#3e3e3e" stroke-width="3"/>
  <circle cx="720" cy="245" r="54" fill="#ffe4c3" stroke="#3e3e3e" stroke-width="3"/>
  <circle cx="850" cy="245" r="54" fill="#fde0bd" stroke="#3e3e3e" stroke-width="3"/>
  <text x="590" y="258" text-anchor="middle" style="font:900 52px Arial">🧑‍⚕️</text>
  <text x="720" y="258" text-anchor="middle" style="font:900 52px Arial">🧑‍💼</text>
  <text x="850" y="258" text-anchor="middle" style="font:900 52px Arial">📋</text>
  <rect class="bubble" x="540" y="140" width="318" height="72" rx="16"/>
  <text x="560" y="178" class="speech">跌倒預防、照顧者團體、</text>
  <text x="560" y="208" class="speech">線上諮詢，全都有人提！</text>
  <text x="548" y="330" class="tiny">每個方案都看起來不錯。</text>

  <!-- Panel 3 -->
  <rect x="1006" y="186" width="66" height="120" rx="10" fill="#d4a146"/>
  <rect x="1092" y="166" width="66" height="140" rx="10" fill="#d4a146"/>
  <rect x="1178" y="218" width="66" height="88" rx="10" fill="#d4a146"/>
  <rect x="1264" y="196" width="66" height="110" rx="10" fill="#d4a146"/>
  <rect class="bubble" x="1000" y="135" width="330" height="68" rx="16"/>
  <text x="1022" y="175" class="speech">每週只有 8 小時，</text>
  <text x="1022" y="205" class="speech">三個方案無法同時做。</text>
  <text x="1005" y="330" class="tiny">真正的問題：先做哪一個？</text>

  <!-- Panel 4 -->
  <rect x="76" y="475" width="150" height="112" rx="16" fill="#e8f1f0" stroke="#aec9c3" stroke-width="3"/>
  <text x="151" y="514" text-anchor="middle" style="font:900 34px Arial; fill:#2a5950">+35%</text>
  <text x="151" y="550" text-anchor="middle" class="small">跌倒轉介需求</text>
  <rect x="262" y="475" width="150" height="112" rx="16" fill="#fdf3df" stroke="#d9c38a" stroke-width="3"/>
  <text x="337" y="514" text-anchor="middle" style="font:900 34px Arial; fill:#8d6220">1 個據點</text>
  <text x="337" y="550" text-anchor="middle" class="small">願意合作</text>
  <rect class="bubble" x="84" y="430" width="298" height="60" rx="16"/>
  <text x="104" y="468" class="speech">資料顯示：需求正在增加。</text>
  <text x="82" y="612" class="tiny">開始有值得優先考慮的方向。</text>

  <!-- Panel 5 -->
  <rect x="534" y="515" width="164" height="90" rx="16" fill="#fce9e7" stroke="#e2b2ac" stroke-width="3"/>
  <text x="616" y="552" text-anchor="middle" style="font:900 34px Arial; fill:#a34f49">28 天</text>
  <text x="616" y="584" text-anchor="middle" class="small">候診等待</text>
  <rect x="724" y="515" width="164" height="90" rx="16" fill="#eef3f8" stroke="#bccadc" stroke-width="3"/>
  <text x="806" y="552" text-anchor="middle" style="font:900 34px Arial; fill:#2f5074">加班↑</text>
  <text x="806" y="584" text-anchor="middle" class="small">人力吃緊</text>
  <rect class="bubble" x="540" y="438" width="298" height="60" rx="16"/>
  <text x="560" y="476" class="speech">需求重要，但也要看做不做得動。</text>
  <text x="542" y="617" class="tiny">團隊開始把「需求」和「限制」一起看。</text>

  <!-- Panel 6 freeze -->
  <text x="1148" y="492" text-anchor="middle" class="freezeBig">等等。</text>
  <text x="1148" y="542" text-anchor="middle" class="freezeBig" style="font-size:38px">現在換你做策略取捨。</text>
  <text x="1148" y="588" text-anchor="middle" class="freezeText" style="font-size:24px">不是選最熱鬧的方案，</text>
  <text x="1148" y="620" text-anchor="middle" class="freezeText" style="font-size:24px">而是選最適合現在的方案。</text>
  <circle cx="1278" cy="472" r="38" fill="#fff" opacity="0.9"/>
  <circle cx="1278" cy="472" r="22" fill="none" stroke="#3c5d86" stroke-width="6"/>
  <line x1="1294" y1="488" x2="1320" y2="514" stroke="#3c5d86" stroke-width="8" stroke-linecap="round"/>

  <!-- tip strip -->
  <rect x="56" y="678" width="1288" height="220" rx="22" fill="#fffaf0" stroke="#d8cba9" stroke-width="4"/>
  <g>
    <circle cx="118" cy="739" r="42" fill="#f8e8c0"/>
    <text x="118" y="753" text-anchor="middle" style="font:900 48px Arial">🕵️</text>
  </g>
  <rect x="176" y="706" width="430" height="66" rx="18" fill="#eef3f8" stroke="#cad6df" stroke-width="3"/>
  <text x="206" y="747" class="speech" style="font-size:28px">策略提示</text>
  <text x="188" y="812" class="small">先看清楚：</text>
  <text x="326" y="812" class="small">目標、需求、限制、資料</text>
  <text x="188" y="850" class="small">以及「試辦後要怎麼學到東西」。</text>

  <rect x="928" y="712" width="344" height="126" rx="28" fill="#f28a2c" stroke="#fff" stroke-width="4"/>
  <circle cx="988" cy="776" r="28" fill="#fff" opacity="0.96"/>
  <circle cx="988" cy="776" r="16" fill="none" stroke="#f28a2c" stroke-width="6"/>
  <line x1="999" y1="787" x2="1019" y2="807" stroke="#f28a2c" stroke-width="7" stroke-linecap="round"/>
  <text x="1120" y="790" text-anchor="middle" style="font:900 44px 'Noto Sans TC', 'Microsoft JhengHei', Arial, sans-serif; fill:#fff">開始取捨 →</text>

  <rect class="tag" x="1162" y="28" width="180" height="44" rx="14"/>
  <text x="1252" y="57" text-anchor="middle" class="tagtext">ALLEN MIND LAB</text>
</svg>
