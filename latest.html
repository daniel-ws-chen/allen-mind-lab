<script>(()=>{const g=document.getElementById('latestGrid');const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/data/articles-manifest.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(m=>{const a=[...(m.articles||[])].filter(x=>x.slug&&x.title&&x.date).sort((x,y)=>String(y.date).localeCompare(String(x.date))||(Number(x.order)||0)-(Number(y.order)||0)).slice(0,20);g.innerHTML=a.map(x=>'<a class="latest-card" href="'+e(x.articlePath||('/articles/'+x.slug+'.html'))+'"><small>'+e(x.cardMeta||x.date)+'</small><strong>'+e(x.title)+'</strong><span>'+e(x.summary||'')+'</span><b>閱讀文章 →</b></a>').join('')}).catch(()=>{g.innerHTML='<p class="latest-status">最新文章暫時無法載入，請前往完整文章館藏。</p>'})})();</script><script defer src="/aml-site.js"></script></body></html>
