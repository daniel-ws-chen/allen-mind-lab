<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>404｜Allen Mind Lab</title><style>
:root{--navy:#071a33;--navy2:#0d294a;--gold:#c7a76a;--cream:#f6f1e7;--ink:#142031;--muted:#657081;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:#fbfaf7;line-height:1.75}
a{color:inherit}.nav{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:18px 5vw;background:rgba(7,26,51,.96);color:#fff;backdrop-filter:blur(8px)}
.brand{text-decoration:none;font-weight:800;letter-spacing:.14em}.links{display:flex;gap:18px;flex-wrap:wrap}.links a{text-decoration:none;font-size:.92rem;opacity:.88}.links a:hover{color:var(--gold)}
.hero{padding:100px 7vw 80px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}.kicker{color:var(--gold);font-weight:700;letter-spacing:.18em;text-transform:uppercase}.hero h1{font-size:clamp(2.5rem,6vw,5.5rem);line-height:1.04;margin:.2em 0}.hero p{max-width:800px;font-size:1.15rem;color:#dfe7f1}
.wrap{max-width:1120px;margin:auto;padding:72px 6vw}.lead{font-size:1.35rem;max-width:850px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:38px}.card{background:#fff;border:1px solid #e6e0d4;border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(9,24,45,.06)}.card h3{margin-top:0;color:var(--navy)}.quote{font-size:1.45rem;border-left:4px solid var(--gold);padding:10px 0 10px 24px;margin:42px 0;color:var(--navy)}
.tag{display:inline-block;padding:5px 10px;border:1px solid #d9c79f;border-radius:999px;color:#7a6030;margin-right:6px;font-size:.82rem}.footer{background:#06172d;color:#e7edf5;padding:50px 7vw;display:grid;grid-template-columns:2fr 1fr;gap:30px}.footer strong{color:var(--gold);font-size:1.35rem}.footlinks{display:grid;gap:8px}.footlinks a{text-decoration:none}.copyright{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.15);padding-top:20px;color:#a9b4c2;font-size:.88rem}
.btn{display:inline-block;text-decoration:none;background:var(--gold);color:#081a30;padding:11px 18px;border-radius:999px;font-weight:700;margin-top:12px}
@media(max-width:820px){.nav{align-items:flex-start;flex-direction:column;gap:12px}.links{gap:10px}.grid{grid-template-columns:1fr}.footer{grid-template-columns:1fr}.hero{padding-top:70px}}
</style><link rel="icon" href="favicon.svg" type="image/svg+xml">
</head><body><header class="hero"><div class="kicker">404</div><h1>這一頁還在探索中。</h1><p>您要找的內容可能已移動，或尚未公開。</p><a class="btn" href="/">回到 Allen Mind Lab</a></header></body></html>
