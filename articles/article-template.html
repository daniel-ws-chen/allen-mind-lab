<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- INTERNAL TEMPLATE ONLY. Remove robots noindex when creating a real article. -->
  <meta name="robots" content="noindex,nofollow">
  <title>{{TITLE}}｜Allen Mind Lab</title>
  <meta name="description" content="{{SEO_DESCRIPTION}}">
  <link rel="canonical" href="https://allenmindlab.com/articles/{{SLUG}}">

  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Allen Mind Lab">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{SUBTITLE_OR_DESCRIPTION}}">
  <meta property="og:url" content="https://allenmindlab.com/articles/{{SLUG}}">
  <meta property="og:image" content="https://allenmindlab.com/images/articles/{{SLUG}}-hero.png">
  <meta property="og:image:alt" content="{{HERO_ALT}}">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{SUBTITLE_OR_DESCRIPTION}}">
  <meta name="twitter:image" content="https://allenmindlab.com/images/articles/{{SLUG}}-hero.png">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/aml-site.css">
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"Article",
    "headline":"{{TITLE}}",
    "alternativeHeadline":"{{SUBTITLE}}",
    "datePublished":"{{YYYY-MM-DD}}",
    "dateModified":"{{YYYY-MM-DD}}",
    "author":{"@type":"Person","name":"陳威勝"},
    "publisher":{"@type":"Organization","name":"Allen Mind Lab"},
    "mainEntityOfPage":"https://allenmindlab.com/articles/{{SLUG}}",
    "image":"https://allenmindlab.com/images/articles/{{SLUG}}-hero.png",
    "description":"{{SEO_DESCRIPTION}}",
    "isAccessibleForFree":true
  }
  </script>
</head>
<body>
  <!-- 建議：從最新正式文章複製 AML global nav/footer，避免手動維護不同版本。 -->
  <main id="aml-main">
    <header>
      <div>{{EYEBROW}}</div>
      <h1>{{TITLE}}</h1>
      <p>{{SUBTITLE}}</p>
      <p>陳威勝 · Allen Mind Lab · {{YYYY.MM.DD}}</p>
    </header>

    <picture>
      <source srcset="/images/articles/{{SLUG}}-hero.webp" type="image/webp">
      <img src="/images/articles/{{SLUG}}-hero.webp" alt="{{HERO_ALT}}" decoding="async" loading="eager" fetchpriority="high">
    </picture>

    <!-- 長文建議加入本文目錄 -->
    <article>
      {{ARTICLE_BODY}}
    </article>

    <section aria-label="延伸閱讀">
      <h2>延伸閱讀</h2>
      {{RELATED_READING}}
    </section>

    <section class="aml-share" aria-label="分享文章">
      <div class="aml-share-copy"><strong>分享這篇文章</strong><p>把這篇 AML 文章分享給可能也會需要的人。</p></div>
      <div class="aml-share-actions">
        <button class="aml-share-btn" data-aml-share type="button">分享文章 ↗</button>
        <button class="aml-share-btn secondary" data-aml-copy-link type="button">複製連結</button>
      </div>
      <div class="aml-share-status" data-aml-share-status aria-live="polite"></div>
    </section>
  </main>

  <section class="aml-article-footer-nav" aria-label="文章閱讀導覽">
    <!-- Previous / Hub / Next：依內容航線填寫，不只按日期。 -->
    {{CONTINUE_READING}}
  </section>

  <script defer src="/aml-site.js"></script>
</body>
</html>
